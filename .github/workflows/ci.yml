name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # lp10 ships for macOS and Linux. The macOS media-key tap is the one
    # platform-specific piece (internal/mediakey, cgo on darwin, a no-op
    # elsewhere). Everything else is portable: pure-Go mDNS, the :2018 tunnel
    # client, ptys / TIOCGWINSZ. We test both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # SHA-pinned: a moved tag cannot change what runs here. Dependabot
      # (.github/dependabot.yml) keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: modernize
        # go fix -diff prints a patch and exits non-zero when the tree isn't at the
        # toolchain modernizer's fixpoint; run `go fix ./...` locally to clear it.
        run: go fix -diff ./...
      # Both legs: the darwin-only cgo file (the media-key tap) is only ever
      # compiled — and so only ever analysed — on macOS.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: test
        run: go test -race ./...
